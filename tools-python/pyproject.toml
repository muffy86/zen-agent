[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zen-agent-tools"
version = "1.0.0"
description = "Polyglot agentic runtime (python head): one provider registry, one policy gate, shared golden vectors with the TypeScript and Kotlin heads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zen-agent" }]
keywords = ["agent", "llm", "router", "mcp", "policy", "polyglot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zen-agent-py = "zen_agent.cli:main"

[tool.setuptools]
packages = ["zen_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
